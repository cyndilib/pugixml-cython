[project]
name = "pugixml-cython"
version = "0.1.0"
description = "A Cython wrapper for pugixml"
readme = "README.md"
authors = [
    { name = "Matthew Reid", email = "matt@nomadic-recording.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[build-system]
requires = [
    "setuptools>=61",
    "numpy",
    "cython>=3.3.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
pugixml_cython = [
    "*.pyx",
    "*.pxd",
    "*.pxi",
    "extern/pugixml/src/pugixml.cpp",
    "extern/pugixml/src/pugixml.hpp",
    "extern/pugixml/src/pugiconfig.hpp",
]

[tool.mypy]
files = ["src/pugixml_cython/", "tests/**/*.py"]
exclude = ["src/pugixml_cython/extern"]


[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "src/**/*.pyi",
    "tests/**/*.py",
]
exclude = ["src/pugixml_cython/extern"]

[tool.cibuildwheel]
build-frontend = "uv"
before-all = "uv export --frozen --no-emit-project --no-build --only-group test -o pylock.toml"
before-test = "uv pip install -r pylock.toml"
test-command = "pytest {project}/tests"


[dependency-groups]
build = [
    "cython>=3.3.0",
    "setuptools>=84.0.0",
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    {include-group = "lint"},
]
lint = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]
test = [
    "pytest>=9.1.1",
]
