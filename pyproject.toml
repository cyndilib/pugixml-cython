[project]
name = "pugixml-cython"
version = "0.1.0"
description = "A Cython wrapper for pugixml"
readme = "README.md"
authors = [
    { name = "Matthew Reid", email = "matt@nomadic-recording.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "LICENSE",
    "LICENSE-pugixml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.16.0 ; python_full_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/cyndilib/pugixml-cython"
Download = "https://pypi.org/project/pugixml-cython"
Source = "https://github.com/cyndilib/pugixml-cython"
Tracker = "https://github.com/cyndilib/pugixml-cython/issues"

[build-system]
requires = [
    "setuptools>=61",
    "numpy",
    "cython>=3.3.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
pugixml_cython = [
    "*.pyx",
    "*.pxd",
    "*.pxi",
    "extern/pugixml/src/pugixml.cpp",
    "extern/pugixml/src/pugixml.hpp",
    "extern/pugixml/src/pugiconfig.hpp",
]

[tool.mypy]
files = ["src/pugixml_cython/", "tests/**/*.py"]
exclude = ["src/pugixml_cython/extern"]


[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "src/**/*.pyi",
    "tests/**/*.py",
]
exclude = ["src/pugixml_cython/extern"]

[tool.cibuildwheel]
build-frontend = "uv"
before-all = "uv export --frozen --no-emit-project --no-build --only-group test -o pylock.toml"
before-test = "uv pip install -r pylock.toml"
test-command = "pytest {project}/tests"


[dependency-groups]
build = [
    "cython>=3.3.0",
    "setuptools>=84.0.0",
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    {include-group = "lint"},
]
lint = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]
test = [
    "pytest>=9.1.1",
    "cython>=3.3.0",
    "setuptools>=84.0.0 ; python_full_version >= '3.12'",
    "pytest-codspeed>=5.0.3",
    "faker>=40.38.0",
]
