name: Build Wheels

on:
  push:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "src/**"
    - "tests/**"
    - ".github/workflows/build_wheels.yml"

  pull_request:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "src/**"
    - "tests/**"
    - ".github/workflows/build_wheels.yml"

  workflow_dispatch:
    inputs:
      allow_deploy:
        description: "Deploy to PyPI"
        required: true
        type: boolean


jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}_${{ matrix.python-version }}-${{ matrix.linux-image }}
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS: |-
        ${{ case(
          matrix.os == 'macos-15-intel', 'x86_64',
          matrix.os == 'macos-latest', 'arm64',
          startsWith(matrix.os, 'blacksmith') && contains(matrix.os, 'ubuntu') && !contains(matrix.os, 'arm'), 'x86_64',
          startsWith(matrix.os, 'blacksmith') && contains(matrix.os, 'ubuntu') && contains(matrix.os, 'arm'), 'aarch64',
          startsWith(matrix.os, 'blacksmith') && contains(matrix.os, 'windows'), 'AMD64',
          ''
        )}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["cp{310,311,312,313,314,315}"]
        os:
          - "blacksmith-2vcpu-ubuntu-2404"
          - "blacksmith-2vcpu-windows-2025"
          - "macos-latest"
          - "macos-15-intel"
        include:
          - os: "blacksmith-4vcpu-ubuntu-2404-arm"
            linux-image: "manylinux"
            python-version: "cp{310,311,312,313,314,315}"
          - os: "blacksmith-4vcpu-ubuntu-2404-arm"
            linux-image: "musllinux"
            python-version: "cp{310,311,312,313,314,315}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
        if: runner.os == 'macOS' && runner.arch == 'ARM64'

      - name: Build wheels
        id: build_wheel
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_ARCHS: ${{ env.CIBW_ARCHS }}
          # If the matrix.linux-image is set, skip the alternate Linux image
          CIBW_SKIP: |-
            ${{ case(
              matrix.linux-image == 'manylinux', '*-musllinux*',
              matrix.linux-image == 'musllinux', '*-manylinux*',
              ''
            )}}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.build_wheel.outcome  == 'success' }}
        with:
          path: ./wheelhouse/*.whl
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.linux-image }}

  deploy:
    needs: build_wheels
    if: ${{ success() && inputs.allow_deploy }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'wheel-*'
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
