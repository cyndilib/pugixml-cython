name: Build Wheels

on:
  push:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "src/**"
    - "tests/**"
    - ".github/workflows/build_wheels.yml"

  pull_request:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "src/**"
    - "tests/**"
    - ".github/workflows/build_wheels.yml"

  workflow_dispatch:
    inputs:
      allow_deploy:
        description: "Deploy to PyPI"
        required: true
        type: boolean


jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}_${{ matrix.python-version }}-${{ matrix.linux-image }}
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS: |-
        ${{ case(
          matrix.os == 'macos-15-intel', 'x86_64',
          matrix.os == 'macos-latest', 'arm64',
          startsWith(matrix.os, 'blacksmith') && contains(matrix.os, 'ubuntu') && !contains(matrix.os, 'arm'), 'x86_64',
          startsWith(matrix.os, 'blacksmith') && contains(matrix.os, 'ubuntu') && contains(matrix.os, 'arm'), 'aarch64',
          startsWith(matrix.os, 'blacksmith') && contains(matrix.os, 'windows'), 'AMD64',
          ''
        )}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["cp{310,311,312,313,314}"]
        os:
          - "blacksmith-2vcpu-ubuntu-2404"
          - "blacksmith-2vcpu-windows-2025"
          - "macos-latest"
          - "macos-15-intel"
        include:
          - os: "blacksmith-4vcpu-ubuntu-2404-arm"
            linux-image: "manylinux"
            python-version: "cp{310,311,312,313,314}"
          - os: "blacksmith-4vcpu-ubuntu-2404-arm"
            linux-image: "musllinux"
            python-version: "cp{310,311,312,313,314}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14
        if: runner.os == 'macOS' && runner.arch == 'ARM64'

      - name: Build wheels
        id: build_wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_ARCHS: ${{ env.CIBW_ARCHS }}
          # If the matrix.linux-image is set, skip the alternate Linux image
          CIBW_SKIP: |-
            ${{ case(
              matrix.linux-image == 'manylinux', '*-musllinux*',
              matrix.linux-image == 'musllinux', '*-manylinux*',
              ''
            )}}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.build_wheel.outcome  == 'success' }}
        with:
          path: ./wheelhouse/*.whl
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.linux-image }}

  deploy:
    needs: build_wheels
    if: ${{ success() && inputs.allow_deploy }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'wheel-*'
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
