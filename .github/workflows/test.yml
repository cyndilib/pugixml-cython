name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ./.github/actions/install-project
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run type checks
        run: uv run mypy
      - name: Run strict type checks
        run: uv run mypy --strict

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ./.github/actions/install-project
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run lint checks
        run: uv run ruff check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest", "ubuntu-22.04-arm"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: ./.github/actions/install-project
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with pytest
        run: uv run pytest
